name: Sync MLTD text to ParaTranz

on:
  schedule:
    # 每天 03:00 UTC（北京时间 11:00）检查一次游戏资源更新
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      init_manifest:
        description: "仅用当前资源 index 初始化 manifest（不下载、不上传），首次部署或需要重置基线时使用"
        type: boolean
        default: false
      dry_run:
        description: "只打印本次将处理的新增/变更文件，不做任何下载和上传"
        type: boolean
        default: false
      repair_missing:
        description: "与 ParaTranz 文件列表对账，自动补传 manifest 已记录但网站上缺失的文件（默认关闭，首次部署可手动开启一次）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mltd-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run text sync
        id: sync
        env:
          PARATRANZ_TOKEN: ${{ secrets.PARATRANZ_TOKEN }}
          PARATRANZ_PROJECT_ID: ${{ secrets.PARATRANZ_PROJECT_ID }}
          INIT_MANIFEST: ${{ inputs.init_manifest || '' }}
          DRY_RUN: ${{ inputs.dry_run || '' }}
          REPAIR_MISSING: ${{ inputs.repair_missing || 'false' }}
        run: |
          args=()
          if [ "$INIT_MANIFEST" = "true" ]; then
            args+=(--init-from-current)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$REPAIR_MISSING" = "true" ]; then
            args+=(--repair-missing)
          fi
          python sync_paratranz.py "${args[@]}"

      - name: Commit updated manifest
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/manifest.json
          if git diff --cached --quiet; then
            echo "manifest 无变化，跳过提交"
          else
            git commit -m "chore(sync): update MLTD text manifest"
            git push
          fi
